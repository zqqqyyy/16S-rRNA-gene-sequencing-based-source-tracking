[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seawatertracker-research"
version = "0.1.0"
description = "Recovered and refactored sequencing source-tracking research methods"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "pandas>=2.2,<3"]

[project.optional-dependencies]
preprocessing = ["cutadapt==5.1"]
dev = ["pytest==9.0.2", "ruff==0.17.0"]

[project.scripts]
seawater-source = "run_source_tracking:main"

[tool.setuptools]
py-modules = ["source_tracking", "primer_trimming", "data_preparation", "run_source_tracking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
